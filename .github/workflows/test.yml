name: Paypay PHP SDK Testing only
on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ 7.2, 7.3, 7.4, 8.0, 8.1, 8.2, 8.3, 8.4, 8.5 ]
    steps:
      - uses: actions/checkout@v6

      - name: Run composer
        run: composer install

      - name: Run Tests
        run: make run_mock
